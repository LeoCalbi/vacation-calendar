[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
authors = [
  { name = "Leonardo Calbi", email = "leocalbi@gmail.com" },
  { name = "Marcello De Giorgi", email = "degiorgimarcello@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Scheduling",
  "Typing :: Typed",
]
dependencies = ["holidays>=0.108", "pydantic>=2.14", "python-dateutil>=2.9"]
description = "Plan work time off across years: public and company holidays, accrual, and leave balances."
keywords = ["holiday", "leave", "planner", "pto", "vacation"]
license = "MIT"
license-files = ["LICENSE"]
name = "vacation-calendar"
readme = "README.md"
requires-python = ">=3.13"
version = "0.2.0.dev0"

[project.urls]
homepage = "https://github.com/LeoCalbi/vacation-calendar"
repository = "https://github.com/LeoCalbi/vacation-calendar"

[tool.hatch.build.targets.wheel]
packages = ["src/vacation_calendar"]

# An allowlist: hatch skips .gitignore'd files only, so any other untracked file in the
# working tree would otherwise ship in the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "src", "tests"]

# Pixi: the dev environment runs the newest supported Python; the py3XX environments
# run the test suite on each supported version.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
vacation-calendar = { path = ".", editable = true }

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

[tool.pixi.feature.test.dependencies]
hypothesis = "*"
pytest = "*"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", description = "Run the test suite" }

[tool.pixi.feature.lint.dependencies]
mypy = "*"
ruff = "*"
types-python-dateutil = ">=2.9.0.20261029,<3"

[tool.pixi.feature.lint.tasks]
check = { depends-on = ["lint", "typecheck", "test"], description = "Run every check CI runs" }
fmt = { cmd = "ruff format && ruff check --fix", description = "Format and autofix" }
lint = { cmd = "ruff format --check && ruff check", description = "Check format and lint" }
typecheck = { cmd = "mypy", description = "Type-check sources and tests" }

[tool.pixi.environments]
default = { features = ["py314", "test", "lint"], solve-group = "py314" }
py313 = { features = ["py313", "test"] }
py314 = { features = ["py314", "test"], solve-group = "py314" }
py315 = { features = ["py315", "test"] }

[tool.pixi.dependencies]
holidays = ">=0.108,<0.109"
pydantic = ">=2.14.2,<3"
python-dateutil = ">=2.9.0.post0,<3"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "EM",   # flake8-errmsg
  "ERA",  # eradicate
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"src/vacation_calendar/cli.py" = ["FBT001", "FBT002"] # Typer declares flags as bool parameters
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true
